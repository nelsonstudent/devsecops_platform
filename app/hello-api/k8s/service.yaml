apiVersion: v1
kind: Service
metadata:
  name: hello-api
  namespace: default
  labels:
    app: hello-api
  annotations:
    description: "Service for hello-api application"
spec:
  type: NodePort
  selector:
    app: hello-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
    nodePort: 30080
  sessionAffinity: None
