name: Build, Scan & Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/hello-api/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/hello-api/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hello-api

jobs:
  # Job 1: Build e Trivy Scan
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/hello-api
        push: false
        load: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
    
    # Scan com Trivy
    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
    
    - name: Upload Trivy results para Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    # Falhar se vulnerabilidades CRÍTICAS encontradas
    - name: Scan image com Trivy (JSON)
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --format json \
          --severity CRITICAL,HIGH \
          --exit-code 1 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    
    # Push para registry
    - name: Push image para registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: ./apps/hello-api
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  
  # Job 2: Update Kubernetes manifests
  update-k8s-manifests:
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update image tag no deployment.yaml
      run: |
        cd apps/hello-api/k8s
        sed -i "s|image: hello-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" deployment.yaml
    
    - name: Commit e push das mudanças
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add apps/hello-api/k8s/deployment.yaml
        git commit -m "chore: update image to ${{ github.sha }}" || true
        git push
  
  # Job 3: Verificações finais
  verify:
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Verificar status
      run: |
        echo "✅ Build completado"
        echo "✅ Scan de segurança realizado"
        echo "✅ Imagem pushed para registry"
        echo "✅ Manifests atualizados"
        echo ""
        echo "🚀 Argo CD vai sincronizar automaticamente"